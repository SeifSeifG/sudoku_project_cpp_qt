name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.*'
          modules: 'qtbase'

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --parallel

      - name: Rename binaries for release
        run: |
          cp build/sudoku-term sudoku-term-linux-x86_64
          cp build/sudoku-qt sudoku-qt-linux-x86_64

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sudoku-term-linux-x86_64
            sudoku-qt-linux-x86_64
          generate_release_notes: true